[global]
    format = "<span foreground='#48484d' size='small'>%a</span>\n<b>%s</b>\n%b"
    frame_color = "#cfcfd6"

[urgency_low]
    background = "#f5f5f7"
    foreground = "#48484d"
    frame_color = "#d8d9de"
    highlight = "#0a60d0"

[urgency_normal]
    background = "#f5f5f7"
    foreground = "#1d1d1f"
    frame_color = "#cfcfd6"
    highlight = "#0a60d0"

[urgency_critical]
    background = "#f5f5f7"
    foreground = "#1d1d1f"
    frame_color = "#d70015"
    highlight = "#d70015"
