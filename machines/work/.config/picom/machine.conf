  # Picom — work. Regras incluídas no início de `rules` do picom.conf.
  # Glass só nos aplicativos desta lista (classe WM_CLASS, sem diferenciar maiúsculas):
  # terminal (kitty), VS Code (Code), launcher (Rofi), notificações (Dunst) e Obsidian
  # (Flatpak: md.obsidian.Obsidian; .deb/AppImage: obsidian).
  # Os demais ficam opacos.
  {
    match = "class_g ?= 'kitty' || class_g ?= 'Code' || class_g ?= 'Rofi' || class_g ?= 'Dunst' || "
            "class_g ?= 'md.obsidian.Obsidian' || class_g ?= 'obsidian'";
    opacity = 0.90;
    blur-background = true;
  },
