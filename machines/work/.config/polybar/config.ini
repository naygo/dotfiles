include-file = ~/.config/polybar/colors-current.ini

[bar/base]
; launch.sh abre uma barra por monitor conectado.
monitor = ${env:MONITOR:eDP-1}
height = 32
dpi = 96
bottom = false
offset-y = 6
radius = 0
fixed-center = true
background = #00000000
foreground = ${colors.fg}
line-size = 0
border-bottom-size = 6
border-color = #00000000
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
font-0 = Ubuntu Sans:size=10;3
font-1 = Symbols Nerd Font:size=11;3
font-2 = Symbols Nerd Font:size=11;3
font-3 = Symbols Nerd Font:size=11;3
font-4 = Symbols Nerd Font Mono:size=11;3
; Símbolos dos títulos (✳ ◑ do Claude Code) antes da emoji colorida, que ignora o size.
font-5 = Noto Sans Symbols2:size=10;3
font-6 = Symbols Nerd Font Mono:size=24;5
font-7 = DejaVu Sans:size=22;1
; A ponta direita precisa de avanço proporcional para terminar na borda da barra.
font-8 = Symbols Nerd Font:size=24;5
font-9 = Ubuntu Sans:style=SemiBold:size=10;3
; Emoji é bitmap de 109 px: reduzir para a altura da barra.
font-10 = Noto Color Emoji:scale=10;2
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
override-redirect = true
wm-restack = i3

[bar/main]
inherit = bar/base
width = 100%
offset-x = 0
offset-y = 0
background = ${colors.menu-bg}
padding-left = 10px
padding-right = 12px
modules-left = launcher window-title
modules-center = i3
modules-right = clipboard screenshot notifications vitals cloudex-usage network pulseaudio tray date

; Barra dos demais monitores: igual à main, sem a bandeja (só uma barra pode ter).
[bar/secondary]
inherit = bar/main
modules-right = clipboard screenshot notifications vitals cloudex-usage network pulseaudio date

[module/launcher]
type = custom/text
format = 
format-font = 4
format-padding = 4px
format-foreground = ${colors.fg}
click-left = ~/.config/rofi/launcher.sh -show drun -show-icons
click-right = ~/.config/rofi/launcher.sh -show run

[module/window-title]
type = internal/xwindow
format = <label>
format-padding = 10px
label = %title:0:48:…%
label-empty = Desktop
label-font = 1
label-foreground = ${colors.fg-dim}

[module/tray]
format-background = ${colors.glass-actions}
format-padding = 4px
tray-background = ${colors.glass-actions}
type = internal/tray
tray-size = 18
tray-spacing = 10
tray-padding = 4

# ─── Módulo: i3 workspaces ───────────────────────────────────────────────────

[module/i3]
format-background = ${colors.glass-bg}
format-padding = 0
type = internal/i3
format = <label-state><label-mode>

index-sort = true
wrapping-scroll = false

; O workspace focado fica em branco e seminegrito; os demais, apagados.
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;10
ws-icon-default = •

label-mode-padding = 2
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.yellow}

label-focused = %icon%
label-focused-font = 10
label-focused-foreground = ${colors.focused-fg}
label-focused-padding = 9px

label-unfocused = %icon%
label-unfocused-background = ${colors.glass-bg}
label-unfocused-padding = 9px
label-unfocused-foreground = ${colors.fg-dark}

label-visible = %icon%
label-visible-background = ${colors.glass-bg}
label-visible-foreground = ${colors.fg-dim}
label-visible-padding = 9px

label-urgent = %icon%
label-urgent-background = ${colors.glass-bg}
label-urgent-foreground = ${colors.red-light}
label-urgent-padding = 9px


# ─── Módulo: data/hora ───────────────────────────────────────────────────────

[module/date]
format-background = ${colors.glass-bg}
format-padding = 0
format-padding-left = 10px
type = internal/date
interval = 1

date = %a %d %b
time = %H:%M

label = %date%%{O8}%{T10}%time%%{T-}
label-font = 1
label-foreground = ${colors.fg}


# ─── Módulo: CPU ─────────────────────────────────────────────────────────────

[module/cpu]
format-background = ${colors.glass-bg}
format-padding = 1
type = internal/cpu
interval = 1

format = <label>
format-prefix = "%{T4}%{T-} "
format-prefix-foreground = ${colors.blue-light}

label = %percentage%%
label-foreground = ${colors.fg}


# ─── Módulo: Memória RAM ─────────────────────────────────────────────────────

[module/memory]
format-background = ${colors.glass-bg}
format-padding = 1
type = internal/memory
interval = 2

format = <label>
format-prefix = "%{T4}󰘚%{T-} "
format-prefix-foreground = ${colors.purple-light}

label = %percentage_used%%
label-foreground = ${colors.fg}


# ─── Módulo: Temperatura ─────────────────────────────────────────────────────
# Execute: cat /sys/class/thermal/thermal_zone*/type
# para descobrir o thermal-zone correto do seu hardware

[module/temperature]
type = custom/script
exec = sensors | grep 'Tctl' | awk '{print $2}' | tr -d '+'
interval = 2
click-left = ~/.config/polybar/scripts/vitals_popover.py popup &

format = <label>
format-prefix = "%{T4}%{T-} "
format-prefix-foreground = ${colors.aqua-light}
label = %output%
label-foreground = ${colors.fg}

; Muda cor quando passar de 80°C
exec-if = test $(sensors | grep 'Tctl' | awk '{gsub(/[^0-9.]/, "", $2); print int($2)}') -lt 80

[module/disk]
type = internal/fs
interval = 30
mount-0 = /
click-left = ~/.config/polybar/scripts/vitals_popover.py popup &

format-mounted = <label-mounted>
format-mounted-prefix = "%{T4}%{T-} "
format-mounted-prefix-foreground = ${colors.orange-light}

label-mounted = %free% livre
label-mounted-foreground = ${colors.fg}

label-warn = %free%
label-warn-foreground = ${colors.yellow-light}


# ─── Módulo: Volume ──────────────────────────────────────────────────────────

[module/pulseaudio]
format-volume-background = ${colors.glass-bg}
format-volume-padding = 7px
format-muted-background = ${colors.glass-bg}
format-muted-padding = 7px
type = internal/pulseaudio
interval = 2

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

label-muted = 󰝟
label-muted-foreground = ${colors.fg-dark}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.fg}
ramp-volume-font = 2

click-right = XDG_CURRENT_DESKTOP=GNOME gnome-control-center sound &


# ─── Módulo: Claude/Codex usage (cloudex-usage) ─────────────────────────────
# Espelha github.com/HugoJF/cloudex-usage: mostra uso do Claude Code/Codex
# quando o CLI estiver rodando e logado. Clique esquerdo abre detalhes.

[module/cloudex-usage]
format-background = ${colors.glass-actions}
format-padding = 7px
type = custom/script
exec = ~/.config/polybar/scripts/cloudex_popover.py bar
interval = 15
click-left = ~/.config/polybar/scripts/cloudex_popover.py popup &

format = <label>
label = %output%
label-foreground = ${colors.fg-dim}


# ─── Módulo: Rede ────────────────────────────────────────────────────────────

[module/network]
format-connected-background = ${colors.glass-bg}
format-connected-padding = 7px
format-disconnected-background = ${colors.glass-bg}
format-disconnected-padding = 7px
type = internal/network
; Troque pela sua interface: execute `ip link` para ver
interface = wlp0s20f3
interval = 3
click-left = XDG_CURRENT_DESKTOP=GNOME gnome-control-center wifi &

format-connected = <ramp-signal>
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-font = 2
ramp-signal-foreground = ${colors.fg}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤮 "
format-disconnected-prefix-foreground = ${colors.red-light}


label-disconnected = offline
label-disconnected-foreground = ${colors.red-light}

# Extremidades arredondadas: compensar 14 px de margem interna dos glifos.
[module/pill-left]
type = custom/text
format = %{O-14}
format-font = 7
format-background = #00000000
format-foreground = ${colors.glass-bg}

[module/pill-right]
type = custom/text
format = %{O-14}
format-font = 7
format-background = #00000000
format-foreground = ${colors.glass-bg}

; Ponta proporcional evita a margem invisível da fonte Mono no centro.
[module/workspace-right]
inherit = module/pill-right
format = 
format-font = 9

[module/action-left]
type = custom/text
format = %{O-14}
format-font = 7
format-background = #00000000
format-foreground = ${colors.glass-actions}

[module/action-right]
type = custom/text
; Offsets negativos finais não reduzem a largura usada no alinhamento à direita.
format = 
format-font = 9
format-background = #00000000
format-foreground = ${colors.glass-actions}

[module/action-base]
type = custom/text
format-font = 2
format-padding = 7px
format-background = ${colors.glass-actions}
format-foreground = ${colors.fg-dim}

[module/clipboard]
inherit = module/action-base
format = 
click-left = copyq toggle

[module/screenshot]
inherit = module/action-base
format = 
click-left = ~/.config/polybar/scripts/capture.sh

[module/notifications]
inherit = module/action-base
format = 
click-left = dunstctl history-pop
click-right = dunstctl set-paused toggle

[module/audio-settings]
inherit = module/action-base
format = 
click-left = XDG_CURRENT_DESKTOP=GNOME gnome-control-center sound &

[module/vitals]
inherit = module/action-base
format = 
click-left = ~/.config/polybar/scripts/vitals_popover.py popup &

[settings]
; Evitar acumular alpha onde as extremidades dos glifos encontram o fundo glass.
compositing-background = source
compositing-foreground = source
