; Polybar — work. Incluído por ~/.config/polybar/config.ini.

[machine]
font-ui = Ubuntu Sans:size=10;3
font-ui-bold = Ubuntu Sans:style=SemiBold:size=10;3
font-icons = Symbols Nerd Font:size=11;3
font-brands = Symbols Nerd Font:size=11;3
; Fonte (índice 1-based) dos ícones de volume/Wi-Fi; 0 = escolha automática.
icon-font = 2
sound-settings = XDG_CURRENT_DESKTOP=GNOME gnome-control-center sound &

[module/network]
inherit = module/network-base
; Troque pela sua interface: execute `ip link` para ver
interface = wlp0s20f3
click-left = XDG_CURRENT_DESKTOP=GNOME gnome-control-center wifi &

format-connected = <ramp-signal>
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-font = ${machine.icon-font}
ramp-signal-foreground = ${colors.fg}

format-disconnected-prefix = "󰤮 "
