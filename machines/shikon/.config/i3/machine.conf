# i3 — shikon (Debian). Incluído por ~/.config/i3/config.

font pango:SF Pro Text 11

exec --no-startup-id ~/.screenlayout/monitors.sh
exec_always --no-startup-id ~/.local/share/desktop-theme/set-wallpapers.sh
exec --no-startup-id nm-applet
exec --no-startup-id blueman-applet

bindsym $mod+t exec thunar

# Screenshot
bindsym Control+Shift+4 exec --no-startup-id flameshot gui --raw | xclip -selection clipboard -t image/png

# Volume (PulseAudio)
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioMute        exec pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brilho
bindsym XF86MonBrightnessUp   exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Workspaces por monitor: 1-6 no Apple (HDMI-0), 7-10 no Samsung vertical (DP-0).
# Só o HDMI-0 tem Polybar, então só os workspaces 1-6 reservam o espaço do topo.
workspace $ws1 output HDMI-0
workspace $ws2 output HDMI-0
workspace $ws3 output HDMI-0
workspace $ws4 output HDMI-0
workspace $ws5 output HDMI-0
workspace $ws6 output HDMI-0
workspace $ws7 output DP-0
workspace $ws8 output DP-0
workspace $ws9 output DP-0
workspace $ws10 output DP-0
