# ─── Kitty config — macOS Graphite ─────────────────────────────────────────────

# ─── Fonte ───────────────────────────────────────────────────────────────────

font_family      SF Mono
bold_font        SF Mono Bold
italic_font      SF Mono Italic
bold_italic_font SF Mono Bold Italic

font_size 10.0

# Ligaduras
disable_ligatures never

# ─── Cursor ──────────────────────────────────────────────────────────────────

cursor_shape     block
shell_integration no-cursor
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0

# Cursor neutro
cursor #ffffff
cursor_text_color #252629

# ─── Transparência ───────────────────────────────────────────────────────────

# 0.0 = totalmente transparente, 1.0 = opaco
# Transparência discreta para leitura
background_opacity 1.0

# Desfoque do fundo (requer picom com suporte a blur)
# Se não funcionar, deixe como 0
background_blur 0

# ─── Espaçamento e padding ───────────────────────────────────────────────────

window_padding_width 12

# Espaçamento entre linhas
line_height 1.2

# ─── Cores — macOS Graphite ────────────────────────────────────────────────────

background #252629
foreground #ffffff

# Preto
color0 #252629
color8 #9699a3

# Vermelho
color1 #f07178
color9 #ff959b

# Verde
color2 #a3cf8c
color10 #bce5a5

# Amarelo
color3 #e6cd86
color11 #f5dfa0

# Azul
color4 #8fb9ed
color12 #b1d1fa

# Roxo
color5 #cba4df
color13 #dfc0ef

# Aqua
color6 #8ccfcb
color14 #ace4e0

# Branco
color7 #e2e2e5
color15 #ffffff

# Seleção de texto
selection_background #56585f
selection_foreground #ffffff

# ─── Abas (tabs) ─────────────────────────────────────────────────────────────

tab_bar_style fade
tab_powerline_style slanted
tab_bar_min_tabs 2

active_tab_foreground #ffffff
active_tab_background #505259
active_tab_font_style   bold

inactive_tab_foreground #d0d1d6
inactive_tab_background #2d2e32
inactive_tab_font_style normal

# ─── Bell ────────────────────────────────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0.0

# ─── Misc ────────────────────────────────────────────────────────────────────

# Abre URLs com clique
open_url_with default

# Copia ao selecionar
copy_on_select yes

# Scroll
scrollback_lines 10000

# Sem decoração de janela (deixa o i3 cuidar disso)
hide_window_decorations yes

# Redimensionamento suave
resize_draw_strategy static
