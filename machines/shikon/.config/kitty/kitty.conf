# ─── Kitty config — Gruvbox Dark ─────────────────────────────────────────────

# ─── Fonte ───────────────────────────────────────────────────────────────────

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic

font_size 12.0

# Ligaduras
disable_ligatures never

# ─── Cursor ──────────────────────────────────────────────────────────────────

cursor_shape     block
shell_integration no-cursor
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0

# Cor do cursor (amarelo gruvbox)
cursor #d79921
cursor_text_color #282828

# ─── Transparência ───────────────────────────────────────────────────────────

# 0.0 = totalmente transparente, 1.0 = opaco
# 0.85 é um bom equilíbrio para leitura
background_opacity 0.85

# Desfoque do fundo (requer picom com suporte a blur)
# Se não funcionar, deixe como 0
background_blur 0

# ─── Espaçamento e padding ───────────────────────────────────────────────────

window_padding_width 12

# Espaçamento entre linhas
line_height 1.2

# ─── Cores — Gruvbox Dark ────────────────────────────────────────────────────

background #282828
foreground #ebdbb2

# Preto
color0  #282828
color8  #928374

# Vermelho
color1  #cc241d
color9  #fb4934

# Verde
color2  #98971a
color10 #b8bb26

# Amarelo
color3  #d79921
color11 #fabd2f

# Azul
color4  #458588
color12 #83a598

# Roxo
color5  #b16286
color13 #d3869b

# Aqua
color6  #689d6a
color14 #8ec07c

# Branco
color7  #a89984
color15 #ebdbb2

# Seleção de texto
selection_background #d79921
selection_foreground #282828

# ─── Abas (tabs) ─────────────────────────────────────────────────────────────

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

active_tab_foreground   #282828
active_tab_background   #d79921
active_tab_font_style   bold

inactive_tab_foreground #a89984
inactive_tab_background #3c3836
inactive_tab_font_style normal

# ─── Bell ────────────────────────────────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0.0

# ─── Misc ────────────────────────────────────────────────────────────────────

# Abre URLs com clique
open_url_with default

# Copia ao selecionar
copy_on_select yes

# Scroll
scrollback_lines 10000

# Sem decoração de janela (deixa o i3 cuidar disso)
hide_window_decorations yes

# Redimensionamento suave
resize_draw_strategy static
