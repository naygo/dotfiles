# ─── Backend ─────────────────────────────────────────────────────────────────

backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = false;
unredir-if-possible = false;

# ─── Opacidade ───────────────────────────────────────────────────────────────

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Glass em todas as janelas de aplicativos, menus e notificações.
# As barras usam transparência própria no fundo, mantendo o texto opaco.
opacity-rule = [
  "90:window_type != 'dock' && window_type != 'desktop' && class_g != 'Polybar'"
];

# ─── Blur ────────────────────────────────────────────────────────────────────

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# ─── Sombra ──────────────────────────────────────────────────────────────────

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.4;
shadow-offset-x = -10;
shadow-offset-y = -10;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'discord'"
];

# ─── Animações ───────────────────────────────────────────────────────────────

animations = ({
  triggers = ["open", "show"];
  preset = "appear";
  duration = 0.15;
  scale = 0.9;
},
{
  triggers = ["close", "hide"];
  preset = "disappear";
  duration = 0.1;
  scale = 0.9;
},
{
  triggers = ["geometry"];
  duration = 0.15;
  preset = "geometry-change";
});

# ─── Fading ──────────────────────────────────────────────────────────────────

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

fade-exclude = [
  "class_g = 'discord'"
];

# ─── Misc ────────────────────────────────────────────────────────────────────

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

# ─── Cantos suaves nas janelas ───────────────────────────────────────────────
corner-radius = 16;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen"
];

# Redesenhar o contorno nos cantos sem mudar a borda original do i3.
window-shader-fg-rule = [
  "shaders/rounded-i3-border.glsl:window_type = 'normal' && !fullscreen"
];
