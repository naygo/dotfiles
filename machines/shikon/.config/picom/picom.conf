# ─── Backend ─────────────────────────────────────────────────────────────────

backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = false;
unredir-if-possible = false;

# ─── Opacidade ───────────────────────────────────────────────────────────────

frame-opacity = 1.0;

# ─── Blur ────────────────────────────────────────────────────────────────────

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# ─── Sombra ──────────────────────────────────────────────────────────────────

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.4;
shadow-offset-x = -10;
shadow-offset-y = -10;

# ─── Animações ───────────────────────────────────────────────────────────────

animations = ({
  triggers = ["open", "show"];
  preset = "appear";
  duration = 0.15;
  scale = 0.9;
},
{
  triggers = ["close", "hide"];
  preset = "disappear";
  duration = 0.1;
  scale = 0.9;
},
{
  triggers = ["geometry"];
  duration = 0.15;
  preset = "geometry-change";
});

# ─── Fading ──────────────────────────────────────────────────────────────────

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# ─── Misc ────────────────────────────────────────────────────────────────────

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

# ─── Cantos suaves nas janelas ───────────────────────────────────────────────
corner-radius = 16;

# Recortar somente os cantos externos: topo nas abas, base no conteúdo.
# Usar regras atuais evita o falso erro de carregamento das regras antigas no 12.5.
rules = (
  # Glass em aplicativos, menus e notificações; barras mantêm opacidade própria.
  {
    match = "window_type != 'dock' && window_type != 'desktop' && class_g != 'Polybar'";
    opacity = 0.90;
    blur-background = true;
  },
  # Minecraft e launcher ficam opacos, sem o efeito glass.
  {
    match = "class_g *?= 'minecraft' || class_i *?= 'minecraft' || ((class_g *?= 'java' || class_g *?= 'lwjgl') && name *?= 'minecraft')";
    opacity = 1.0;
    blur-background = false;
  },
  {
    match = "class_g = 'Polybar' || class_g = 'i3-frame' || name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || window_type = 'dock' || _GTK_FRAME_EXTENTS@ || class_g = 'discord'";
    shadow = false;
  },
  {
    match = "class_g = 'discord'";
    fade = false;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    blur-background = false;
  },
  {
    match = "class_g = 'i3-frame' || _I3_GROUPED@ = 1 || window_type = 'dock' || window_type = 'desktop' || fullscreen";
    corner-radius = 0;
  },
  {
    match = "class_g = 'Polybar'";
    shadow = false;
    blur-background = true;
    corner-radius = 0;
  },
  {
    match = "window_type = 'normal' && !fullscreen && class_g != 'i3-frame' && class_g != 'org.gnome.Nautilus' && !(_GTK_FRAME_EXTENTS@) && !(_I3_GROUPED@ = 1)";
    shader = "/home/naygo/.config/picom/shaders/rounded-i3-border.glsl";
  },
  {
    match = "class_g = 'i3-frame' && !fullscreen";
    corner-radius = 0;
    shadow = false;
    shader = "/home/naygo/.config/picom/shaders/group-top.glsl";
  },
  {
    match = "_I3_GROUPED@ = 1 && !fullscreen";
    corner-radius = 0;
    shader = "/home/naygo/.config/picom/shaders/group-bottom.glsl";
  },
  # GTK popups include transparent margins for their native shadows.
  # Blurring that full rectangle produces a large halo around small menus.
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'tooltip' || window_type = 'menu' || window_type = 'combo'";
    opacity = 1.0;
    blur-background = false;
    shadow = false;
    corner-radius = 0;
  },
  # Nautilus GTK4 windows may report normal with no GTK_FRAME_EXTENTS.
  # Preserve native alpha, corners and shadows rather than drawing an i3 outline.
  {
    match = "class_g = 'org.gnome.Nautilus'";
    opacity = 1.0;
    blur-background = false;
    shadow = false;
    corner-radius = 0;
  }

);
