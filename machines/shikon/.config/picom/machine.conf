  # Picom — shikon. Regras incluídas no início de `rules` do picom.conf.
  # Glass em aplicativos, menus e notificações; barras mantêm opacidade própria.
  {
    match = "window_type != 'dock' && window_type != 'desktop' && class_g != 'Polybar'";
    opacity = 0.90;
    blur-background = true;
  },
  # Minecraft, launcher, Google Chrome e Stremio ficam opacos, sem o efeito glass.
  {
    match = "class_g *?= 'stremio' || class_i *?= 'stremio' || class_g ?= 'Google-chrome' || class_i ?= 'google-chrome' || class_g *?= 'minecraft' || class_i *?= 'minecraft' || ((class_g *?= 'java' || class_g *?= 'lwjgl') && name *?= 'minecraft')";
    opacity = 1.0;
    blur-background = false;
  },
