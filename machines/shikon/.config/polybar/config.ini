[colors]
; macOS-inspired dark menu bar
bg        = #202124
bg1       = #303136
bg2       = #484a50
bg3       = #63656d
fg        = #f5f5f7
fg-dim    = #a1a1a8
fg-dark   = #787880

red       = #ff453a
red-light = #ff6961
green     = #30d158
green-light = #70df89
yellow    = #ffd60a
yellow-light = #ffe066
blue      = #0a84ff
blue-light = #64b5ff
purple    = #bf5af2
purple-light = #d9a0ff
aqua      = #5ac8fa
aqua-light = #80daff
orange    = #ff9f0a
orange-light = #ffc15e

actions   = #303136
; Mesmo fundo em todos os módulos e na bandeja.
menu-bg       = #e6202124
glass-bg      = ${colors.menu-bg}
glass-actions = ${colors.menu-bg}
glass-active  = #e6d79921


[bar/base]
monitor = HDMI-0
height = 32
dpi = 96
bottom = false
offset-y = 6
radius = 0
fixed-center = true
background = #00000000
foreground = ${colors.fg}
line-size = 0
border-bottom-size = 6
border-color = #00000000
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
font-0 = SF Pro Text:size=10;3
font-1 = Font Awesome 5 Free:style=Solid:size=11;3
font-2 = Font Awesome 5 Brands:style=Regular:size=11;3
font-3 = Symbols Nerd Font:size=11;3
font-4 = Symbols Nerd Font Mono:size=11;3
font-5 = Noto Color Emoji:size=11;3
font-6 = Symbols Nerd Font Mono:size=24;5
font-7 = DejaVu Sans:size=22;1
; A ponta direita precisa de avanço proporcional para terminar na borda da barra.
font-8 = Symbols Nerd Font:size=24;5
font-9 = SF Pro Text:style=Semibold:size=10;3
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
override-redirect = true
wm-restack = i3

[bar/main]
inherit = bar/base
width = 100%
offset-x = 0
offset-y = 0
background = ${colors.menu-bg}
padding-left = 2
padding-right = 2
modules-left = launcher window-title
modules-center = i3
modules-right = clipboard screenshot notifications vitals cloudex-usage network pulseaudio tray date

[module/launcher]
type = custom/text
format = 
format-font = 4
format-padding = 1
format-foreground = ${colors.blue-light}
click-left = rofi -show drun -show-icons
click-right = rofi -show run

[module/window-title]
type = internal/xwindow
format = <label>
format-padding = 1
label = %title:0:38:…%
label-empty = Desktop
label-font = 10
label-foreground = ${colors.fg}

[module/tray]
format-background = ${colors.glass-actions}
format-padding = 1
tray-background = ${colors.glass-actions}
type = internal/tray
tray-size = 18
tray-spacing = 10
tray-padding = 4

# ─── Módulo: i3 workspaces ───────────────────────────────────────────────────

[module/i3]
format-background = ${colors.glass-bg}
format-padding = 0
type = internal/i3
format = <label-state><label-mode>

index-sort = true
wrapping-scroll = false

; Cada workspace ocupa 32 px, com o número centralizado em SF Pro Text.
ws-icon-0 = 1;%{O13}1%{O13}
ws-icon-1 = 2;%{O12}2%{O12}
ws-icon-2 = 3;%{O11}3%{O12}
ws-icon-3 = 4;%{O11}4%{O12}
ws-icon-4 = 5;%{O12}5%{O12}
ws-icon-5 = 6;%{O11}6%{O12}
ws-icon-6 = 7;%{O12}7%{O12}
ws-icon-7 = 8;%{O11}8%{O12}
ws-icon-8 = 9;%{O11}9%{O12}
ws-icon-9 = 10;%{O8}10%{O9}
ws-icon-default = •

label-mode-padding = 2
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.yellow}

label-focused = %icon%
label-focused-font = 10
label-focused-background = #45474e
label-focused-foreground = #ffffff
label-focused-padding = 0

label-unfocused = %icon%
label-unfocused-background = ${colors.glass-bg}
label-unfocused-padding = 0
label-unfocused-foreground = ${colors.fg-dim}

label-visible = %icon%
label-visible-background = ${colors.glass-bg}
label-visible-foreground = ${colors.fg}
label-visible-padding = 0

label-urgent = %icon%
label-urgent-background = ${colors.glass-bg}
label-urgent-foreground = ${colors.red-light}
label-urgent-padding = 0


# ─── Módulo: data/hora ───────────────────────────────────────────────────────

[module/date]
format-background = ${colors.glass-bg}
format-padding = 1
type = internal/date
interval = 1

date = %a %d %b
time = %H:%M

label = %date%  %time%
label-font = 10
label-foreground = ${colors.aqua-light}


# ─── Módulo: CPU ─────────────────────────────────────────────────────────────

[module/cpu]
format-background = ${colors.glass-bg}
format-padding = 1
type = internal/cpu
interval = 1

format = <label>
format-prefix = "%{T4}%{T-} "
format-prefix-foreground = ${colors.blue-light}

label = %percentage%%
label-foreground = ${colors.fg}


# ─── Módulo: Memória RAM ─────────────────────────────────────────────────────

[module/memory]
format-background = ${colors.glass-bg}
format-padding = 1
type = internal/memory
interval = 2

format = <label>
format-prefix = "%{T4}󰘚%{T-} "
format-prefix-foreground = ${colors.purple-light}

label = %percentage_used%%
label-foreground = ${colors.fg}


# ─── Módulo: Temperatura ─────────────────────────────────────────────────────
# Execute: cat /sys/class/thermal/thermal_zone*/type
# para descobrir o thermal-zone correto do seu hardware

[module/temperature]
type = custom/script
exec = sensors | grep 'Tctl' | awk '{print $2}' | tr -d '+'
interval = 2
click-left = ~/.config/polybar/scripts/vitals_popover.py popup &

format = <label>
format-prefix = "%{T4}%{T-} "
format-prefix-foreground = ${colors.aqua-light}
label = %output%
label-foreground = ${colors.fg}

; Muda cor quando passar de 80°C
exec-if = test $(sensors | grep 'Tctl' | awk '{gsub(/[^0-9.]/, "", $2); print int($2)}') -lt 80

[module/disk]
type = internal/fs
interval = 30
mount-0 = /
click-left = ~/.config/polybar/scripts/vitals_popover.py popup &

format-mounted = <label-mounted>
format-mounted-prefix = "%{T4}%{T-} "
format-mounted-prefix-foreground = ${colors.orange-light}

label-mounted = %free% livre
label-mounted-foreground = ${colors.fg}

label-warn = %free%
label-warn-foreground = ${colors.yellow-light}


# ─── Módulo: Volume ──────────────────────────────────────────────────────────

[module/pulseaudio]
format-volume-background = ${colors.glass-bg}
format-volume-padding = 1
format-muted-background = ${colors.glass-bg}
format-muted-padding = 1
type = internal/pulseaudio
interval = 2

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

label-muted = 󰝟 mudo
label-muted-foreground = ${colors.fg-dark}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.orange-light}

click-right = pavucontrol


# ─── Módulo: Claude/Codex usage (cloudex-usage) ─────────────────────────────
# Espelha github.com/HugoJF/cloudex-usage: mostra uso do Claude Code/Codex
# quando o CLI estiver rodando e logado. Clique esquerdo abre detalhes.

[module/cloudex-usage]
format-background = ${colors.glass-actions}
format-padding = 1
type = custom/script
exec = ~/.config/polybar/scripts/cloudex_popover.py bar
interval = 15
click-left = ~/.config/polybar/scripts/cloudex_popover.py popup &

format = <label>
label = %output%
label-foreground = ${colors.fg-dim}


# ─── Módulo: Rede ────────────────────────────────────────────────────────────

[module/network]
format-connected-background = ${colors.glass-bg}
format-connected-padding = 1
format-disconnected-background = ${colors.glass-bg}
format-disconnected-padding = 1
type = internal/network
; Troque pela sua interface: execute `ip link` para ver
interface = enp5s0
interval = 3

format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green-light}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰌙 "
format-disconnected-prefix-foreground = ${colors.red-light}

label-connected = 󰈀
label-connected-foreground = ${colors.fg}

label-disconnected = offline
label-disconnected-foreground = ${colors.red-light}

# Extremidades arredondadas: compensar 14 px de margem interna dos glifos.
[module/pill-left]
type = custom/text
format = %{O-14}
format-font = 7
format-background = #00000000
format-foreground = ${colors.glass-bg}

[module/pill-right]
type = custom/text
format = %{O-14}
format-font = 7
format-background = #00000000
format-foreground = ${colors.glass-bg}

; Ponta proporcional evita a margem invisível da fonte Mono no centro.
[module/workspace-right]
inherit = module/pill-right
format = 
format-font = 9

[module/action-left]
type = custom/text
format = %{O-14}
format-font = 7
format-background = #00000000
format-foreground = ${colors.glass-actions}

[module/action-right]
type = custom/text
; Offsets negativos finais não reduzem a largura usada no alinhamento à direita.
format = 
format-font = 9
format-background = #00000000
format-foreground = ${colors.glass-actions}

[module/action-base]
type = custom/text
format-font = 2
format-padding = 1
format-background = ${colors.glass-actions}
format-foreground = ${colors.fg}

[module/clipboard]
inherit = module/action-base
format = 
click-left = copyq toggle

[module/screenshot]
inherit = module/action-base
format = 
click-left = ~/.config/polybar/scripts/capture.sh

[module/notifications]
inherit = module/action-base
format = 
click-left = dunstctl history-pop
click-right = dunstctl set-paused toggle

[module/audio-settings]
inherit = module/action-base
format = 
click-left = pavucontrol

[module/vitals]
inherit = module/action-base
format = 
click-left = ~/.config/polybar/scripts/vitals_popover.py popup &

[settings]
; Evitar acumular alpha onde as extremidades dos glifos encontram o fundo glass.
compositing-background = source
compositing-foreground = source
