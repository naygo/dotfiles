; Polybar — shikon. Incluído por ~/.config/polybar/config.ini.

[machine]
font-ui = SF Pro Text:size=10;3
font-ui-bold = SF Pro Text:style=Semibold:size=10;3
font-icons = Font Awesome 5 Free:style=Solid:size=11;3
font-brands = Font Awesome 5 Brands:style=Regular:size=11;3
; Fonte (índice 1-based) dos ícones de volume; 0 = escolha automática.
icon-font = 0
sound-settings = pavucontrol

[module/network]
inherit = module/network-base
; Troque pela sua interface: execute `ip link` para ver
interface = enp5s0

format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green-light}
label-connected = 󰈀
label-connected-foreground = ${colors.fg}

format-disconnected-prefix = "󰌙 "
