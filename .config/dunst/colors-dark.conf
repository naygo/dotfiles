[global]
    format = "<span foreground='#b5b7c0' size='small'>%a</span>\n<b>%s</b>\n%b"
    frame_color = "#484a50"

[urgency_low]
    background = "#202124"
    foreground = "#b5b7c0"
    frame_color = "#303136"
    highlight = "#64b5ff"

[urgency_normal]
    background = "#202124"
    foreground = "#f5f5f7"
    frame_color = "#484a50"
    highlight = "#0a84ff"

[urgency_critical]
    background = "#202124"
    foreground = "#f5f5f7"
    frame_color = "#ff6961"
    highlight = "#ff6961"
